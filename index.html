<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --indigo:#160F41; --corallo:#D17A66; --giallo:#F5D973; --viola:#402058;
  --azzurro:#00ADEE; --verde:#0FA396;
  --bg:#FFFFFF; --testo:#160F41; --testo2:#402058;
  --card:#FFFFFF; --bordo:#E4E1EC; --chip:#FFFFFF; --chipBordo:#CFCADC;
  --pannello:#FAF9FC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120C33; --testo:#F3F1F8; --testo2:#C9C2DF;
    --card:#1B1348; --bordo:#33285F; --chip:#1B1348; --chipBordo:#40357A;
    --pannello:#180F40;
  }
}
:root[data-theme="dark"]{
  --bg:#120C33; --testo:#F3F1F8; --testo2:#C9C2DF;
  --card:#1B1348; --bordo:#33285F; --chip:#1B1348; --chipBordo:#40357A;
  --pannello:#180F40;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--testo);
  font-family:"Work Sans","Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px; margin:0 auto; padding:28px 20px 64px}
header h1{font-size:1.65rem; font-weight:700; margin:0 0 4px; letter-spacing:-.01em}
header .sottotesto{font-size:1.02rem; font-weight:600; color:var(--corallo); margin:0}
.rule{height:3px; width:44px; background:var(--giallo); border-radius:2px; margin:0 0 18px}
.loghi{display:flex; align-items:center; gap:16px; margin:0 0 22px}
.loghi img{display:block; width:auto}
.loghi .otb{height:44px}
.loghi .dn{height:24px}
.loghi .sep{width:1px; height:30px; background:var(--bordo)}
:root[data-theme="dark"] .loghi img{filter:brightness(0) invert(1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .loghi img{filter:brightness(0) invert(1)}}
@media(max-width:480px){ .loghi .otb{height:36px} .loghi .dn{height:20px} }

/* passi */
.steps{display:flex; gap:8px; flex-wrap:wrap; margin:26px 0 20px}
.step{
  flex:1 1 140px; min-width:120px; display:flex; align-items:center; gap:10px;
  background:var(--card); border:1.5px solid var(--bordo); border-radius:12px;
  padding:10px 12px; cursor:pointer; text-align:left; color:var(--testo);
  font-family:inherit; font-size:.82rem; font-weight:600; line-height:1.25;
  transition:border-color .15s, background .15s;
}
.step:hover{border-color:var(--corallo)}
.step[aria-current="true"]{border-color:var(--corallo); background:color-mix(in srgb, var(--corallo) 10%, var(--card))}
.step.done .n{background:var(--corallo); color:#fff; border-color:var(--corallo)}
.step img{width:26px; height:26px; flex:0 0 26px}
.step .n{
  display:inline-flex; width:22px; height:22px; flex:0 0 22px; border-radius:50%;
  border:1.5px solid var(--chipBordo); background:var(--card);
  font-size:.72rem; font-weight:700; align-items:center; justify-content:center;
}
.step .lbl{flex:1; min-width:0}
.avanz{display:flex; align-items:center; gap:12px; margin:0 0 22px}
.track{flex:1; height:6px; border-radius:99px; background:var(--bordo); overflow:hidden}
.fill{height:100%; background:var(--corallo); border-radius:99px; width:25%; transition:width .25s}
#avanzTxt{font-size:.8rem; font-weight:600; color:var(--testo2); white-space:nowrap}
.kicker{margin:0 0 3px !important; font-size:.72rem; font-weight:700; letter-spacing:.09em;
  text-transform:uppercase; color:var(--corallo) !important}

/* griglia */
.grid{display:grid; grid-template-columns:1fr; gap:22px}
@media(min-width:900px){ .grid{grid-template-columns:1.18fr .82fr; align-items:start} }

.card{background:var(--card); border:1.5px solid var(--bordo); border-radius:16px; padding:22px}
.card-head{display:flex; gap:14px; align-items:flex-start; margin-bottom:6px}
.card-head img{width:46px; height:46px; flex:0 0 46px}
.card-head h2{margin:0; font-size:1.2rem; font-weight:700}

.group{margin-top:20px; padding-top:18px; border-top:1px solid var(--bordo)}
.group h3{margin:0 0 2px; font-size:.78rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--corallo)}
.group .hint{margin:0 0 12px; font-size:.9rem; color:var(--testo2); max-width:62ch}
textarea{
  width:100%; font-family:inherit; font-size:.95rem; line-height:1.55; color:var(--testo);
  background:var(--pannello); border:1.5px solid var(--chipBordo); border-radius:10px;
  padding:12px 14px; min-height:132px; resize:vertical;
}
textarea:focus{outline:none; border-color:var(--corallo)}
textarea::placeholder{color:var(--testo2); opacity:.72}

/* regole fisse */
.fisse{margin-top:22px; padding:14px 16px; border-radius:12px;
  background:color-mix(in srgb, var(--giallo) 26%, var(--card)); border:1.5px solid var(--giallo)}
:root[data-theme="dark"] .fisse, :root:not([data-theme="light"]) .fisse{color:var(--indigo)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fisse{color:#160F41}}
.fisse h4{margin:0 0 6px; font-size:.78rem; letter-spacing:.07em; text-transform:uppercase}
.fisse ul{margin:0; padding-left:18px; font-size:.86rem}
.fisse li+li{margin-top:5px}

/* navigazione */
.nav{display:flex; gap:10px; margin-top:24px}
.btn{
  font-family:inherit; font-size:.92rem; font-weight:600; border-radius:10px;
  padding:11px 18px; cursor:pointer; border:1.5px solid var(--corallo); transition:.15s;
}
.btn-p{background:var(--corallo); color:#fff}
.btn-p:hover{filter:brightness(1.07)}
.btn-s{background:transparent; color:var(--corallo)}
.btn-s:hover{background:color-mix(in srgb, var(--corallo) 12%, transparent)}
.btn:disabled{opacity:.35; cursor:not-allowed}
.nav .spacer{flex:1}

/* anteprima */
.preview{position:sticky; top:20px; background:var(--card); border:1.5px solid var(--bordo); border-radius:16px; padding:20px}
.preview h2{margin:0 0 12px; font-size:1.05rem; font-weight:700}
.out{
  background:var(--pannello); border:1.5px solid var(--bordo); border-radius:12px;
  padding:14px; font-size:.9rem; line-height:1.55; min-height:150px;
  max-height:360px; overflow-y:auto; white-space:pre-wrap; word-break:break-word;
}
.out .vuoto{color:var(--testo2); font-style:italic}
.meta{margin-top:10px; font-size:.76rem; color:var(--testo2); display:flex; justify-content:space-between; gap:10px}
.pact{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
.mancanti{margin-top:12px; font-size:.8rem; color:var(--testo2)}
.mancanti b{color:var(--corallo)}
.verifica{margin-top:14px; padding:13px 15px; border-radius:12px; background:var(--pannello);
  border:1.5px solid var(--bordo); border-left:4px solid var(--corallo)}
.verifica h3{margin:0 0 7px; font-size:.74rem; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; color:var(--corallo)}
.verifica ul{margin:0; padding-left:17px; font-size:.83rem; line-height:1.45; color:var(--testo2)}
.verifica li+li{margin-top:5px}
.verifica li b{color:var(--testo); font-weight:600}
footer{margin-top:34px; padding-top:16px; border-top:1px solid var(--bordo); font-size:.78rem; color:var(--testo2)}
footer a{color:var(--corallo); font-weight:600; text-decoration:none; border-bottom:1px solid currentColor}
footer a:hover{filter:brightness(1.1)}
</style>
</head>

const DATI = [
{
  id:"ruolo", breve:"Ruolo", nome:"Specifica il ruolo", etichetta:"Ruolo",
  hint:"Chi siete, che ruolo ricoprite, anche quanti anni avete.",
  ph:"Sono un'insegnante di italiano e storia in un istituto tecnico. La classe è una seconda di 24 studenti fra i 15 e i 16 anni, abituati a lavorare in gruppo ma poco allenati alla lettura di testi lunghi."
},
{
  id:"compito", breve:"Compito", nome:"Spiega cosa deve fare", etichetta:"Compito",
  hint:"Elenca quali passaggi servono per ottenere il risultato: “Prima fai questo. Poi questo. Poi quest'altro. Infine...”",
  ph:"Leggi i tre articoli che trovi qui sotto. Per ciascuno individua la tesi e gli argomenti che la sostengono, poi segnala i punti in cui i testi si contraddicono. Alla fine proponi tre domande da portare in classe."
},
{
  id:"obiettivo", breve:"Obiettivo", nome:"Definisci l'obiettivo", etichetta:"Obiettivo",
  hint:"Qual è il fine ultimo che si vuole raggiungere?",
  ph:"Il materiale mi serve per una lezione di un'ora sulle fonti: gli studenti devono arrivare a distinguere un dato verificabile da un'opinione, partendo da testi che parlano tutti dello stesso fatto."
},
{
  id:"limiti", breve:"Limiti", nome:"Stabilisci i limiti", etichetta:"Limiti",
  hint:"Dentro quali confini deve stare: lunghezza, formato, registro, durata.",
  ph:"Massimo 500 parole in italiano, con un elenco puntato per ogni articolo. Linguaggio adatto a ragazzi di 15 anni, nessun termine tecnico senza spiegazione. Non aggiungere esercizi di verifica e non usare emoji."
}];

const CHIAVE = "otb-prompt-generator-v1";
let stato = {passo:0, testi:{}};
try{ const s = localStorage.getItem(CHIAVE); if(s){ const p = JSON.parse(s); if(p && p.testi) stato = Object.assign(stato, p); } }catch(e){}
function salva(){ try{ localStorage.setItem(CHIAVE, JSON.stringify(stato)); }catch(e){} }

const pieno = id => (stato.testi[id]||"").trim().length > 0;
function componi(){
  const blocchi = DATI.filter(s=>pieno(s.id)).map(s=> s.etichetta + ": " + stato.testi[s.id].trim());
  return blocchi.join("\n\n");
}

function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }

function render(){
  const stepsEl = document.getElementById("steps");
  stepsEl.innerHTML = "";
  DATI.forEach((sez,i)=>{
    const b = document.createElement("button");
    b.className = "step" + (pieno(sez.id) ? " done" : "");
    b.setAttribute("aria-current", i===stato.passo ? "true" : "false");
    b.innerHTML = '<span class="n">'+(pieno(sez.id)?"&#10003;":(i+1))+'</span><img src="'+ICONE[i]+'" alt=""><span class="lbl">'+sez.breve+'</span>';
    b.onclick = ()=>{ stato.passo=i; salva(); render(); };
    stepsEl.appendChild(b);
  });

  const sez = DATI[stato.passo];
  const card = document.getElementById("card");
  card.innerHTML = '<div class="card-head"><img src="'+ICONE[stato.passo]+'" alt=""><div>'
    + '<p class="kicker">Passo '+(stato.passo+1)+' di '+DATI.length+'</p>'
    + '<h2>'+sez.nome+'</h2></div></div>';

  const d = document.createElement("div");
  d.className = "group";
  d.innerHTML = "<h3>"+sez.etichetta+"</h3>"
    + '<p class="hint">'+sez.hint+'</p>'
    + '<textarea id="campo" placeholder="'+esc(sez.ph)+'">'+esc(stato.testi[sez.id]||"")+'</textarea>';
  card.appendChild(d);

  if(stato.passo===DATI.length-1){
    const f = document.createElement("div");
    f.className = "fisse";
    f.innerHTML = '<h4>Regole fisse</h4><ul>'
      + '<li>Nessun dato personale di studenti o famiglie dentro il prompt: nomi, valutazioni, certificazioni, situazioni familiari.</li>'
      + '<li>Per tutto ciò che riguarda gli studenti si usa l\'ambiente IA istituzionale della scuola. Gli strumenti gratuiti restano per il materiale generico.</li></ul>';
    card.appendChild(f);
  }

  const nav = document.createElement("div");
  nav.className = "nav";
  const ultimo = stato.passo===DATI.length-1;
  nav.innerHTML = '<button class="btn btn-s" id="prec"'+(stato.passo===0?" disabled":"")+'>'
    + (stato.passo===0 ? "Indietro" : "Indietro: "+DATI[stato.passo-1].breve) + '</button><span class="spacer"></span>'
    + '<button class="btn btn-p" id="succ">'
    + (ultimo ? "Vedi il prompt" : "Passo "+(stato.passo+2)+": "+DATI[stato.passo+1].breve) + '</button>';
  card.appendChild(nav);

  const campo = document.getElementById("campo");
  campo.oninput = ()=>{ stato.testi[sez.id] = campo.value; salva(); aggiornaOut(); aggiornaPassi(); };

  document.getElementById("prec").onclick = ()=>{ stato.passo=Math.max(0,stato.passo-1); salva(); render(); };
  document.getElementById("succ").onclick = ()=>{
    if(ultimo){ document.querySelector(".preview").scrollIntoView({behavior:"smooth", block:"start"}); return; }
    stato.passo++; salva(); render(); window.scrollTo({top:0, behavior:"smooth"});
  };

  document.getElementById("fill").style.width = ((stato.passo+1)/DATI.length*100)+"%";
  document.getElementById("avanzTxt").textContent = "Passo "+(stato.passo+1)+" di "+DATI.length;
  aggiornaOut();
}

function aggiornaPassi(){
  document.querySelectorAll(".steps .step").forEach((b,i)=>{
    const ok = pieno(DATI[i].id);
    b.classList.toggle("done", ok);
    b.querySelector(".n").innerHTML = ok ? "&#10003;" : (i+1);
  });
}

function aggiornaOut(){
  const testo = componi();
  const out = document.getElementById("out");
  out.innerHTML = testo ? "" : '<span class="vuoto">Scrivi il primo passaggio e il prompt comincia a comporsi qui.</span>';
  if(testo) out.textContent = testo;
  const fatte = DATI.filter(s=>pieno(s.id)).length;
  document.getElementById("conta").textContent = fatte + " passaggi su " + DATI.length;
  document.getElementById("parole").textContent = testo ? testo.trim().split(/\s+/).length + " parole" : "";
  const mancano = DATI.filter(s=>!pieno(s.id)).map(s=>s.breve);
  document.getElementById("mancanti").innerHTML = mancano.length
    ? "Non hai ancora scritto: <b>"+mancano.join(", ")+"</b>. Quello che non specifichi lo decide il modello al posto tuo."
    : "Tutti e quattro i passaggi sono scritti.";
  document.getElementById("verifica").innerHTML = mancano.length ? "" :
    '<div class="verifica"><h3>Controlla il risultato</h3><ul>'
    + '<li><b>Verifica i fatti.</b> Nomi, date, cifre, citazioni e fonti possono essere inventati anche quando la risposta sembra sicura.</li>'
    + '<li><b>Guarda che cosa ha dato per scontato.</b> Esempi, nomi e situazioni che non avevi chiesto dicono quali stereotipi ha usato per riempire i vuoti.</li>'
    + '<li><b>Correggi il prompt, non la risposta.</b> Se il risultato non va, cambia un passaggio e rilancia: capisci quale variabile pesava.</li>'
    + '<li><b>Dichiaralo.</b> Se il materiale arriva agli studenti o ai colleghi, scrivi che è stato prodotto con l\'IA.</li>'
    + '</ul></div>';
}

document.getElementById("copia").onclick = async ()=>{
  const testo = componi(); if(!testo) return;
  const b = document.getElementById("copia");
  try{ await navigator.clipboard.writeText(testo); b.textContent="Copiato"; }
  catch(e){ b.textContent="Copia non riuscita"; }
  setTimeout(()=> b.textContent="Copia", 1600);
};
document.getElementById("azzera").onclick = ()=>{
  stato = {passo:0, testi:{}};
  try{ localStorage.removeItem(CHIAVE); }catch(e){}
  render();
};
render();
</script>
